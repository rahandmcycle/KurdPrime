
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبۆردی بەڕێوەبردنی ستاف</title>
    <!-- فۆنتی کوردی Noto Kufi Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- کتێبخانەی Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --card-border: #232f48;
            --primary: #3b82f6;
            --primary-hover: #1d4ed8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Kufi Arabic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1150px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #60a5fa;
        }

        .config-btn {
            background: #1e293b;
            color: #93c5fd;
            border: 1px solid #3b82f6;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        /* بەشەکان (Tabs) */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 10px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        /* فۆڕم */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            background: #0b0f19;
            border: 1px solid var(--card-border);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            font-size: 14px;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        /* خشتە */
        .table-container {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--card-border);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 13px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background-color: #111827;
            color: var(--text-muted);
            font-weight: 700;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
        }

        .status-done { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-progress { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-pending { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .status-published { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }

        .delete-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* Modal بۆ ڕێکخستنی Supabase */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--card-border);
        }

        .status-loading {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>داشبۆردی بەڕێوەبردنی ستاف</h1>
            <p style="color: var(--text-muted); font-size: 13px;">تۆماری وەرگێڕان، تەکنیک و بڵاوکردنەوە</p>
        </div>
        <button class="config-btn" onclick="openModal()">⚙️ بەستنەوە بە Supabase</button>
    </header>

    <!-- تابس -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('anime')">ئەنیمێ</button>
        <button class="tab-btn" onclick="switchTab('manhwa')">مانهوا</button>
        <button class="tab-btn" onclick="switchTab('kdrama')">کەی دراما</button>
        <button class="tab-btn" onclick="switchTab('movies')">فیلم و زنجیرە</button>
    </div>

    <!-- فۆڕم -->
    <div class="card">
        <form id="taskForm" onsubmit="handleAddTask(event)">
            <div class="form-grid">
                <div class="input-group">
                    <label id="titleLabel">ناوی بەرهەم</label>
                    <input type="text" id="itemTitle" required placeholder="ناو بنووسە...">
                </div>
                <div class="input-group">
                    <label id="numLabel">ژمارەی ئەڵقە</label>
                    <input type="text" id="itemNumber" required placeholder="نموونە: 01">
                </div>
                <div class="input-group">
                    <label>وەرگێڕان</label>
                    <select id="tlStatus">
                        <option value="pending">❌ نەکراوە</option>
                        <option value="progress">⏳ لە کارکردندایە</option>
                        <option value="done">✅ تەواو بووە</option>
                    </select>
                </div>
                <div class="input-group">
                    <label id="techLabel">تەکنیک</label>
                    <select id="techStatus">
                        <option value="pending">❌ نەکراوە</option>
                        <option value="progress">⏳ لە کارکردندایە</option>
                        <option value="done">✅ تەواو بووە</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>دانان و بڵاوکردنەوە</label>
                    <select id="uploadStatus">
                        <option value="pending">❌ نەکراوە</option>
                        <option value="progress">⏳ خەریکم</option>
                        <option value="published">🚀 بڵاوکرایەوە</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>تێبینی</label>
                    <input type="text" id="itemNotes" placeholder="تێبینی...">
                </div>
            </div>
            <button type="submit" class="submit-btn" id="saveBtn">+ زیادکردنی کار</button>
        </form>
    </div>

    <!-- خشتە -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th id="thName">ناو</th>
                    <th id="thNum">ئەڵقە</th>
                    <th>وەرگێڕان</th>
                    <th id="thTech">تەکنیک</th>
                    <th>دانان</th>
                    <th>تێبینی</th>
                    <th>کردار</th>
                </tr>
            </thead>
            <tbody id="taskList">
                <tr><td colspan="7" class="status-loading">تکایە سەرەتا سوپابەیس ببەستەوە لە ڕێگەی دوگمەی ⚙️ سەرەوە</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- مۆداڵی زانیارییەکانی Supabase -->
<div class="modal" id="configModal">
    <div class="modal-content">
        <h3 style="margin-bottom: 15px;">زانیارییەکانی Supabase</h3>
        <div class="input-group" style="margin-bottom: 12px;">
            <label>https://flwxxhqxedwyizyueliy.supabase.co</label>
            <input type="text" id="sbUrl" placeholder="https://xxxx.supabase.co">
        </div>
        <div class="input-group" style="margin-bottom: 15px;">
            <label>eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsd3h4aHF4ZWR3eWl6eXVlbGl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTAyOTIsImV4cCI6MjEwNDEyNjI5Mn0.0jmpU5o65bj8m3bc8dVCrqkpRtj3_p5xBxTRHb1XKfY</label>
            <input type="text" id="sbKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6...">
        </div>
        <button class="submit-btn" onclick="saveConfig()">پاشەکەوتکردن و پەیوەستبوون</button>
        <button onclick="closeModal()" style="width: 100%; background: transparent; border: none; color: var(--text-muted); margin-top: 10px; cursor: pointer;">داخستن</button>
    </div>
</div>

<script>
    let supabaseClient = null;
    let currentCategory = 'anime';
    let tasksList = [];

    const categoryLabels = {
        anime: { name: 'ناوی ئەنیمێ', num: 'ئەڵقە', tech: 'تەکنیک' },
        manhwa: { name: 'ناوی مانهوا', num: 'چاپتەر', tech: 'تایپ و کلیین' },
        kdrama: { name: 'ناوی دراما', num: 'ئەڵقە', tech: 'سینک و دەرهێنان' },
        movies: { name: 'ناوی فیلم/زنجیرە', num: 'ئەڵقە/بەش', tech: 'تەکنیک' }
    };

    const statusMap = {
        pending: { text: '❌ نەکراوە', class: 'status-pending' },
        progress: { text: '⏳ خەریکم', class: 'status-progress' },
        done: { text: '✅ تەواوە', class: 'status-done' },
        published: { text: '🚀 بڵاوکرایەوە', class: 'status-published' }
    };

    // بارکردنی سەرەتایی
    window.onload = () => {
        const url = localStorage.getItem('sb_url');
        const key = localStorage.getItem('sb_key');
        if (url && key) {
            initSupabase(url, key);
        } else {
            openModal();
        }
    };

    function initSupabase(url, key) {
        supabaseClient = supabase.createClient(url, key);
        fetchTasks();
        
        // گوێگرتن لە گۆڕانکارییە ڕاستەوخۆکان (Realtime)
        supabaseClient.channel('public:tasks')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => {
                fetchTasks();
            })
            .subscribe();
    }

    async function fetchTasks() {
        if (!supabaseClient) return;
        const { data, error } = await supabaseClient.from('tasks').select('*').order('id', { ascending: false });
        if (!error && data) {
            tasksList = data;
            renderTasks();
        }
    }

    async function handleAddTask(e) {
        e.preventDefault();
        if (!supabaseClient) {
            alert('تکایە سەرەتا سوپابەیس ببەستەوە!');
            return;
        }

        const btn = document.getElementById('saveBtn');
        btn.innerText = 'خەریکی پاشەکەوتکردنە...';

        const newTask = {
            category: currentCategory,
            title: document.getElementById('itemTitle').value,
            number: document.getElementById('itemNumber').value,
            tl: document.getElementById('tlStatus').value,
            tech: document.getElementById('techStatus').value,
            upload: document.getElementById('uploadStatus').value,
            notes: document.getElementById('itemNotes').value || '-'
        };

        const { error } = await supabaseClient.from('tasks').insert([newTask]);
        btn.innerText = '+ زیادکردنی کار';

        if (error) {
            alert('هەڵەیەک ڕوویدا لە کاتی ناردن: ' + error.message);
        } else {
            document.getElementById('taskForm').reset();
            fetchTasks();
        }
    }

    async function deleteTask(id) {
        if (confirm('دڵنیایت لە سڕینەوەی ئەم کارە؟')) {
            await supabaseClient.from('tasks').delete().eq('id', id);
            fetchTasks();
        }
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';

        const filtered = tasksList.filter(t => t.category === currentCategory);

        if (filtered.length === 0) {
            list.innerHTML = `<tr><td colspan="7" class="status-loading">هیچ کارێک بۆ ئەم بەشە تۆمار نەکراوە.</td></tr>`;
            return;
        }

        filtered.forEach(task => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${task.title}</strong></td>
                <td>${task.number}</td>
                <td><span class="status-badge ${statusMap[task.tl]?.class}">${statusMap[task.tl]?.text}</span></td>
                <td><span class="status-badge ${statusMap[task.tech]?.class}">${statusMap[task.tech]?.text}</span></td>
                <td><span class="status-badge ${statusMap[task.upload]?.class}">${statusMap[task.upload]?.text}</span></td>
                <td>${task.notes}</td>
                <td><button class="delete-btn" onclick="deleteTask(${task.id})">سڕینەوە</button></td>
            `;
            list.appendChild(tr);
        });
    }

    function switchTab(cat) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            const cats = ['anime', 'manhwa', 'kdrama', 'movies'];
            btn.classList.toggle('active', cats[idx] === cat);
        });

        const labels = categoryLabels[cat];
        document.getElementById('titleLabel').innerText = labels.name;
        document.getElementById('numLabel').innerText = 'ژمارەی ' + labels.num;
        document.getElementById('techLabel').innerText = labels.tech;
        document.getElementById('thName').innerText = labels.name;
        document.getElementById('thNum').innerText = labels.num;
        document.getElementById('thTech').innerText = labels.tech;

        renderTasks();
    }

    function openModal() {
        document.getElementById('sbUrl').value = localStorage.getItem('sb_url') || '';
        document.getElementById('sbKey').value = localStorage.getItem('sb_key') || '';
        document.getElementById('configModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('configModal').style.display = 'none';
    }

    function saveConfig() {
        const url = document.getElementById('sbUrl').value.trim();
        const key = document.getElementById('sbKey').value.trim();
        if (url && key) {
            localStorage.setItem('sb_url', url);
            localStorage.setItem('sb_key', key);
            initSupabase(url, key);
            closeModal();
        } else {
            alert('تکایە هەردوو خانەکە پڕبکەرەوە!');
        }
    }
</script>

</body>
</html>
